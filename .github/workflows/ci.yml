name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Mỗi đêm chạy thêm job `pool-stress` (xem bên dưới) để bắt lỗi cạn bể kết nối kể cả khi không có commit mới.
  schedule:
    - cron: '0 20 * * *'

jobs:
  build:
    # Lịch hằng đêm chỉ chạy job `pool-stress`; các lần push/PR chạy cả hai job song song.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nexamed
          POSTGRES_PASSWORD: nexamed
          POSTGRES_DB: nexamed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Role app (không superuser/BYPASSRLS/DELETE) — dùng cho build/test, giống runtime thật.
      DATABASE_URL: postgresql://nexamed_app:nexamed_app@localhost:5432/nexamed?schema=public
      # Role đặc quyền — chỉ dùng để chạy migration (bước "Prisma migrate deploy" bên dưới).
      MIGRATE_DATABASE_URL: postgresql://nexamed:nexamed@localhost:5432/nexamed?schema=public
      # API không khởi động nếu thiếu 2 biến này (env.schema.ts). Giá trị GIẢ chỉ cho CI — không phải bí mật.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ `packageManager` trong package.json — KHÔNG khai báo `version` ở đây (khai 2 nơi → ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 26 (LTS từ 28/10/2026) = đúng phiên bản production (apps/*/Dockerfile). `@testcontainers/postgresql` còn ghim ở bản 11.x từ thời Node 20 (bản 12 đòi
          # Node >=22.19); nay production đã Node 26 nên CÓ THỂ nâng lên 12 — để dành, chưa cần.
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mandatory columns (8 cột bắt buộc)
        run: pnpm db:check-schema

      - name: Prisma migrate deploy (áp migration lên Postgres thật, dùng role đặc quyền)
        run: pnpm --filter @nexamed/api run db:deploy

      - name: Prisma generate
        run: pnpm --filter @nexamed/api run db:generate

      - name: Build packages dùng chung (seed/test cần dist của @nexamed/shared và @nexamed/core)
        run: pnpm --filter @nexamed/shared --filter @nexamed/core run build

      - name: Seed danh mục permission (migrate deploy không tự seed như migrate dev)
        run: pnpm --filter @nexamed/api run db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
  # Chống cạn bể kết nối (docs/DECISIONS.md #264, #296): chạy TOÀN BỘ test API với bể Prisma chỉ còn 1 kết nối. Chỗ nào giữ một
  # kết nối rồi xin thêm kết nối khác (giao dịch lồng nhau) sẽ tự khoá và lộ ra ngay thay vì chỉ chập chờn lúc máy bận. Bổ sung cho
  # bộ phát hiện lúc chạy (`transaction-scope.ts`, đã bật sẵn trong `pnpm test` của job `build`) và phép phân tích tĩnh AST. Job riêng
  # chạy song song nên không kéo dài job `build`.
  pool-stress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Test API tự dựng Postgres bằng testcontainers (src/testing/global-setup.ts) nên không cần service Postgres; hai biến dưới chỉ để API/Prisma nạp được.
      DATABASE_URL: postgresql://nexamed_app:nexamed_app@localhost:5432/nexamed?schema=public
      MIGRATE_DATABASE_URL: postgresql://nexamed:nexamed@localhost:5432/nexamed?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      TEST_DB_CONNECTION_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @nexamed/api run db:generate
      - name: Build packages dùng chung
        run: pnpm --filter @nexamed/shared --filter @nexamed/core run build
      - name: Test API với bể 1 kết nối
        run: pnpm --filter @nexamed/api test
