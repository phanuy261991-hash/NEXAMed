# Triển khai on-premise NEXAMed — S4-05 (docs/product/plan.md mục 7, docs/Deploy.md Phần 2).
# Dùng đúng cho cả 2 trường hợp phần cứng: PC thường tại phòng khám (Docker Desktop) VÀ
# NAS/máy chủ chuyên dụng (Docker Engine) — không đổi file này giữa 2 trường hợp, xem
# docs/Deploy.md Phần 0.2 ("ranh giới thật không phải on-prem vs cloud mà là single-tenant vs
# multi-tenant" — cả 2 trường hợp đều single-tenant, giống nhau về mọi mặt ảnh hưởng code/hạ
# tầng).
#
# HAI GIAI ĐOẠN (docs/DECISIONS.md #098) — máy khách KHÔNG BAO GIỜ build, KHÔNG BAO GIỜ nhận
# source code/`.git`/`docs`, kể cả lần cài đầu tiên:
#   A. Máy dev/CI (có source đầy đủ): deploy/on-prem/build-and-export.ps1 build 4 ảnh
#      (nexamed-api/nexamed-web/nexamed-backup/nexamed-setup) rồi `docker save` ra file .tar.gz.
#   B. Máy khách (chỉ nhận file .tar.gz + thư mục deploy/on-prem/ đã lọc): nexamed-setup (trình cài đặt, docs/DECISIONS.md #238)
#      `docker load` các ảnh đó rồi `docker compose up -d` — không cần internet.
#
# Chạy ở máy khách: nexamed-setup.cmd (Windows PC) hoặc nexamed-setup.sh
# (Linux/NAS). Build ở máy dev: xem deploy/on-prem/build-and-export.ps1.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+ mount thẳng /var/lib/postgresql (không phải .../data), cùng quy ước
      # docker-compose.yml gốc ở thư mục dev (xem ghi chú trong file đó).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Chạy MỘT LẦN mỗi lúc `docker compose up` (kể cả sau khi PC khởi động lại) rồi thoát — KHÔNG
  # phải service chạy dài hạn. Idempotent: `migrate deploy` bỏ qua migration đã áp, đổi mật khẩu
  # role app dùng cùng giá trị không đổi gì, seed danh mục dùng upsert — an toàn khi chạy lại.
  # KHÔNG tạo tenant/tài khoản pilot ở đây (cần Tên phòng khám/Tên đăng nhập cụ thể, việc một lần
  # do người cài chủ động chạy tay — trình cài đặt làm ở bước "Tạo phòng khám và quản trị viên").
  migrate:
    image: nexamed-api:${NEXAMED_VERSION:?NEXAMED_VERSION chua dat trong .env - chay nexamed-setup de nap anh Docker truoc}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexamed_app:${NEXAMED_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NEXAMED_APP_DB_PASSWORD: ${NEXAMED_APP_DB_PASSWORD}
      # Trình cài đặt (docs/DECISIONS.md #238) chạy db:seed:platform-operator qua service này: cần cùng khoá với API để mã hoá bí mật OTP trong cơ sở dữ liệu.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    working_dir: /repo/apps/api
    command: >
      sh -c "pnpm run db:deploy &&
             pnpm run db:rotate-app-password &&
             pnpm run db:seed"
    restart: 'no'

  api:
    image: nexamed-api:${NEXAMED_VERSION:?NEXAMED_VERSION chua dat trong .env - chay nexamed-setup de nap anh Docker truoc}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nexamed_app:${NEXAMED_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN}
      STORAGE_DIR: /data/storage
      # KHÔNG để trống — suy ra từ NODE_ENV=production sẽ đánh dấu cookie refresh token Secure,
      # trình duyệt âm thầm bỏ qua cookie đó trên http:// (mặc định on-prem không TLS) → refresh
      # hỏng không báo lỗi (bug thật phát hiện lúc verify S4-05). Đặt "true" trong .env CHỈ khi
      # đã có TLS thật trước nginx.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Số lớp reverse proxy đáng tin trước API (docs/DECISIONS.md #244): 1 = chỉ nginx (cài LAN),
      # 2 = Caddy HTTPS + nginx (VPS/SaaS). Thiếu giá trị này thì máy chủ thấy mọi người dùng chung
      # một IP (của nginx) — giới hạn tần suất gộp cả hệ thống và nhật ký ghi sai IP.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Chế độ triển khai (docs/DECISIONS.md #237): single = một công ty (mặc định, on-prem/VPS/NAS); saas = nhiều công ty theo tên miền phụ, cần PLATFORM_BASE_DOMAIN.
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-single}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-}
      PLATFORM_ADMIN_SUBDOMAIN: ${PLATFORM_ADMIN_SUBDOMAIN:-admin}
      # S6-01 (docs/DECISIONS.md #141) — đọc trạng thái backup do container `backup` ghi ra, cùng
      # volume `backup_status_data` mount ở service đó (dưới), CHỈ ĐỌC ở đây.
      BACKUP_STATUS_FILE: /data/backup-status/backup-status.json
      # Chỉ để HIỂN THỊ thư mục đích sao lưu ở "Cấu hình hệ thống → Sao lưu dữ liệu" (#217).
      BACKUP_HOST_DIR_DISPLAY: ${BACKUP_DIR_DISPLAY:-${BACKUP_HOST_DIR:-./backup-data}}
      # Địa chỉ máy chủ phát hành để KIỂM TRA bản mới (docs/DECISIONS.md #236) — nhà cung cấp đặt lúc bàn giao, để trống = chưa cấu hình.
      RELEASE_SERVER_URL: ${RELEASE_SERVER_URL:-}
      # Khoá nhà cung cấp phần mềm của cổng Đơn thuốc quốc gia (docs/DECISIONS.md #242 GĐ3) — chỉ cần cho API nhà thuốc; để trống = chưa cấu hình.
      INTEROP_APP_NAME: ${INTEROP_APP_NAME:-}
      INTEROP_APP_KEY: ${INTEROP_APP_KEY:-}
      # S6-06 (ADM-05) — Chromium cài qua apt trong apps/api/Dockerfile, luôn đúng đường dẫn này
      # trong container, không cần người cài đặt tự sửa.
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - api_storage:/data/storage
      # Ghi được (không còn :ro) vì API ghi cấu hình sao lưu + cờ "Sao lưu ngay" vào đây cho container `backup` đọc (#217).
      - backup_status_data:/data/backup-status
    restart: unless-stopped

  web:
    image: nexamed-web:${NEXAMED_VERSION:?NEXAMED_VERSION chua dat trong .env - chay nexamed-setup de nap anh Docker truoc}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Mặc định mở ra mọi địa chỉ của máy; kiểu VPS/SaaS (có Caddy) và kiểu "chỉ trên máy này" đặt WEB_BIND_IP=127.0.0.1 để chỉ nơi nội bộ vào được web.
      - '${WEB_BIND_IP:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80'
    volumes:
      # Cấu hình runtime (tenantId/apiBaseUrl) — file thật do trình cài đặt sinh ra cạnh compose
      # này, sửa trực tiếp không cần build lại ảnh (docs/DECISIONS.md #020).
      - ./config.json:/usr/share/nginx/html/config.json:ro
    restart: unless-stopped

  # Cửa ngõ HTTPS cho kiểu VPS và SaaS (docs/DECISIONS.md #238) — chỉ chạy khi COMPOSE_PROFILES=https. Tự xin/gia hạn chứng chỉ (VPS) hoặc dùng chứng chỉ wildcard
  # do người vận hành tải lên (SaaS, ./certs). Caddy giữ nguyên tiêu đề Host nên API nhận ra công ty theo tên miền.
  caddy:
    image: caddy:2.8-alpine
    profiles: ['https']
    depends_on:
      web:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backup:
    image: nexamed-backup:${NEXAMED_VERSION:?NEXAMED_VERSION chua dat trong .env - chay nexamed-setup de nap anh Docker truoc}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # S6-01 (docs/DECISIONS.md #141) — file trạng thái (JSON) ghi sau MỖI lần chạy, container
      # `api` đọc qua cùng volume `backup_status_data` (mount read-only ở service đó, trên).
      BACKUP_STATUS_FILE: /status/backup-status.json
      # Thư mục ảnh đính kèm (docs/DECISIONS.md #216) — CHỈ ĐỌC, cùng volume `api_storage` của `api`; bản sao nằm ở `<BACKUP_HOST_DIR>/storage`.
      STORAGE_DIR: /data/storage
    volumes:
      - api_storage:/data/storage:ro
      # Mặc định ghi vào thư mục cạnh compose — ĐỔI sang ổ đĩa/ổ ngoài thật ở BACKUP_HOST_DIR
      # trong .env trước khi dùng thật cho pilot (một thư mục cùng ổ với postgres_data không bảo
      # vệ được khỏi hỏng ổ đĩa — xem docs/Deploy.md, diễn tập phục hồi đầy đủ ở S6-02).
      - ${BACKUP_HOST_DIR:-./backup-data}:/backups
      - backup_status_data:/status
    restart: unless-stopped

volumes:
  postgres_data:
  api_storage:
  caddy_data:
  caddy_config:
  # S6-01 — nội bộ container, KHÔNG bind-mount ra host (khác `backup-data`/`postgres_data`): chỉ
  # 1 file JSON nhỏ trạng thái backup, không phải dữ liệu cần backup/khôi phục.
  backup_status_data: