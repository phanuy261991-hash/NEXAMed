# Nginx phục vụ apps/web (static, SPA) + reverse proxy /api sang service `api` — S4-05.
# Web và API cùng chung một origin (cổng nginx) qua proxy này: trình duyệt không cần biết cổng
# nội bộ của API, không cần CORS (cùng origin), không cần mở thêm cổng ra ngoài máy chủ.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Header bảo mật cơ bản (rà soát mã 13/10/2026). Content-Security-Policy mới ở chế độ Report-Only (14/10/2026): trình duyệt chỉ ghi vi phạm vào
    # Console, KHÔNG chặn. Chuyển sang chế độ chặn (đổi tên header) sau khi pilot chạy một thời gian không còn cảnh báo.
    # `add_header` ở `location` bên dưới GHI ĐÈ header cấp server (nginx không kế thừa), nên 4 header phải lặp lại ở mỗi
    # `location` có `add_header` riêng (Cache-Control).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # `index.html`/`config.json` KHÔNG được cache — config.json sửa trực tiếp lúc cài đặt, không
    # rebuild ảnh (docs/DECISIONS.md #020); index.html phải luôn trỏ đúng bundle JS/CSS mới nhất
    # sau mỗi lần cập nhật phiên bản.
    location = /config.json {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store";
    }
    location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store";
    }

    # Asset tĩnh có hash tên file (Vite) — cache dài hạn an toàn, đổi bản là đổi tên file.
    location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA — mọi route phía client (react-router-dom) fallback về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy toàn bộ /api/* (gồm cả /api/v1/files/:token phục vụ ảnh/logo qua signed URL,
    # xem apps/api/src/infrastructure/storage/public-file.controller.ts) sang service `api`.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Refresh token là cookie httpOnly (S1-04) — phải đi qua nguyên vẹn qua proxy.
        proxy_cookie_path / /;
    }
}